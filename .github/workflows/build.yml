name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build MkDocs site
        working-directory: mkdocs
        run: uv run --no-project --with mkdocs-material==9.7.6 mkdocs build

  # Note 03 teaches how to read eval numbers using the classifier's own runs, so it
  # quotes them. kb-agent indexes this repo, which makes a stale figure here not just
  # wrong on a page but speakable by an agent as the current number — the propagation
  # path SYS-017 recorded when a bad citation reached the glossary. Marked figures are
  # asserted against the producer's published artifact; historical v1/v2 blocks are
  # deliberately unmarked, because superseded numbers are this note's actual lesson.
  published-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check quoted metrics against the classifier artifact
        run: python scripts/check_published_metrics.py

  # The rules in that checker whose failure mode is a QUIET PASS need their own tests:
  # a marker placed where it breaks the rendered page still reports a clean run, so
  # nothing but a test says the rule works. The check itself needs the network (it
  # fetches the producer's artifact); these do not, and run on literal markdown.
  published-metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run the checker's tests
        run: python -m pytest tests/ -q

  # The deployed site is the repo-root static output of build_site.py /
  # build_graph.py (deploy-pages.yml uploads "."), NOT the mkdocs build above.
  # Those generated files had no CI, so a source edit with a forgotten rebuild
  # shipped a stale page. This gate regenerates from source (stdlib only, no
  # deps) and fails if the committed output drifts — the "edit the source, not
  # the output" rule in CLAUDE.md, mechanically enforced.
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Regenerate and check for drift
        run: |
          python build_site.py
          python build_graph.py
          if ! git diff --exit-code -- index.html concept-map.html assets/category-map.svg; then
            echo "::error::Generated files are stale — run build_site.py and build_graph.py and commit the output."
            exit 1
          fi

  # Mobile is a first-class constraint in CLAUDE.md, and until 2026-09-20 no
  # gate held it. This job renders the deployed pages at phone widths and
  # fails on horizontal overflow. It runs the pass twice. The second pass
  # sets a 20px root font, which is a reader's large-text setting. A heading
  # sizes itself in rem, so a long token fits at 16px and widens the page at
  # 20px. That pass found exactly that on index.html when the gate landed.
  #
  # The job regenerates the pages first, so it measures the CSS that
  # build_site.py holds now. The generated-files job above separately proves
  # the committed output matches that source.
  mobile-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Build the site
        run: |
          python build_site.py
          python build_graph.py

      - name: Install Playwright Chromium
        working-directory: scripts
        run: |
          npm ci
          # Chromium only, and no --with-deps. That flag pulls Debian
          # packages the runner image already carries, and it fails when an
          # upstream index hash drifts.
          npx playwright install chromium

      - name: Mobile QA gate (no horizontal overflow at 320/360/390/430)
        run: node scripts/mobile-qa.cjs

      - name: Mobile QA gate, large text (same widths at a 20px root)
        run: node scripts/mobile-qa.cjs
        env:
          ROOT_FONT_PX: 20
